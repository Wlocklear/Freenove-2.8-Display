<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CYD stand viewer</title><style>html,body{margin:0;height:100%;background:#1b1d22;overflow:hidden;font-family:sans-serif}
#panel{position:fixed;top:8px;left:10px;color:#cdd;font-size:13px;line-height:1.6;background:#00000055;padding:8px 10px;border-radius:6px}
#panel b{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:middle}
#tabs{position:fixed;top:8px;right:10px;display:flex;gap:6px}
#tabs button{background:#2a2d36;color:#cdd;border:1px solid #444;border-radius:5px;padding:6px 12px;font-size:13px;cursor:pointer}
#tabs button.active{background:#5a4a8a;border-color:#8a78c2;color:#fff}
#tabs button:hover{background:#3a3d46}
#hint{position:fixed;bottom:8px;left:10px;color:#889;font-size:12px}
#reload{position:fixed;bottom:8px;right:10px;color:#889;font-size:12px;background:#2a2d36;border:1px solid #444;border-radius:5px;padding:5px 10px;cursor:pointer}
#reload:hover{background:#3a3d46}
</style></head>
<body>
<div id="panel"></div>
<div id="tabs"></div>
<div id="hint">drag rotate · scroll zoom · right-drag pan</div>
<button id="reload">reload model</button>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const MODELS = {
  case: {
    label: 'Case (2 parts)', file: 'exports/case.glb',
    legend: [['#969696','front_panel (standoffs fused in)'], ['#aa78d2','base (posts fused in)']],
    note: '2 printable parts, bolt together with 2 M3 screws'
  },
  usbc: {
    label: 'USB-C coupon', file: 'exports/coupons/usbc_coupon.glb',
    legend: [['#aa78d2','usbc_coupon (printable fitment test)']],
    note: 'test-fits the USB-C panel mount before committing to the full base'
  },
  speaker: {
    label: 'Freenove Speaker Coupon', file: 'exports/coupons/Freenove_Speaker_Coupon.glb',
    legend: [['#aa78d2','Freenove_Speaker_Coupon (wall + grille + ledge + clip, printable)']],
    note: 'ledge at the bottom + 2 corner clips at the top hold the speaker over the grille'
  },
};

const s = new THREE.Scene(); s.background = new THREE.Color(0x1b1d22);
const cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 5000); cam.up.set(0, 0, 1);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.setPixelRatio(devicePixelRatio);
document.body.appendChild(r.domElement);
s.add(new THREE.AmbientLight(0xffffff, 0.75));
const d = new THREE.DirectionalLight(0xffffff, 0.9); d.position.set(-1, -1, 2); s.add(d);
const d2 = new THREE.DirectionalLight(0xffffff, 0.4); d2.position.set(1, 1, -1); s.add(d2);
const c = new OrbitControls(cam, r.domElement); c.enableDamping = true;

let current = null;
const loader = new GLTFLoader();

function buildPanel(key) {
  const m = MODELS[key];
  const panel = document.getElementById('panel');
  panel.innerHTML = m.legend.map(([col, label]) => `<div><b style="background:${col}"></b>${label}</div>`).join('') +
    `<div>${m.note}</div>`;
}

function buildTabs(active) {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  for (const key in MODELS) {
    const btn = document.createElement('button');
    btn.textContent = MODELS[key].label;
    btn.className = key === active ? 'active' : '';
    btn.onclick = () => loadModel(key);
    tabs.appendChild(btn);
  }
}

function loadModel(key) {
  buildTabs(key); buildPanel(key);
  localStorage.setItem('cyd-viewer-model', key);
  loader.load(MODELS[key].file + '?' + Date.now(), g => {
    if (current) s.remove(current);
    const o = g.scene;
    const box = new THREE.Box3().setFromObject(o);
    const ctr = box.getCenter(new THREE.Vector3());
    const R = box.getSize(new THREE.Vector3()).length();
    o.position.sub(ctr);
    s.add(o); current = o;
    const D = R * 1.15;
    cam.position.set(-D * 0.5, -D * 0.7, D * 0.35); cam.lookAt(0, 0, 0); c.target.set(0, 0, 0); c.update();
  }, undefined, err => {
    document.getElementById('panel').innerHTML += `<div style="color:#f88">failed to load ${MODELS[key].file}</div>`;
  });
}

document.getElementById('reload').onclick = () => {
  const active = document.querySelector('#tabs button.active');
  const key = Object.keys(MODELS).find(k => MODELS[k].label === active.textContent);
  loadModel(key);
};

addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight) });
(function a() { requestAnimationFrame(a); c.update(); r.render(s, cam) })();

loadModel(localStorage.getItem('cyd-viewer-model') in MODELS ? localStorage.getItem('cyd-viewer-model') : 'speaker');
</script></body></html>
